<!DOCTYPE html>
<html>
<head>
  <title>NaijaJobConnect - Apply & Post Jobs</title>

  <!-- Include Paystack Inline JS script -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: #007bff;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .job-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .job-title {
      font-size: 20px;
      font-weight: bold;
    }

    .apply-btn {
      background: #007bff;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px;
    }

    .apply-btn:hover {
      background: #0056b3;
    }

    .post-job {
      background: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      display: inline-block;
      margin-top: 20px;
    }

    .post-job:hover {
      background: #1e7e34;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: white;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>NaijaJobConnect</h1>
    <p>Find jobs easily & post jobs fast</p>
  </header>

  <div class="container">

    <div class="job-card">
      <div class="job-title">Customer Service Officer</div>
      <p>Company: XYZ Ltd</p>
      <a href="https://www.jobberman.com/jobs" class="apply-btn" target="_blank">
        Apply on Jobberman
      </a>
    </div>

    <div class="job-card">
      <div class="job-title">Graphic Designer (Remote)</div>
      <p>Company: ABC Digital</p>
      <a href="https://www.indeed.com/q-nigeria-jobs.html" class="apply-btn" target="_blank">
        Apply on Indeed
      </a>
    </div>

    <!-- Button that triggers the Paystack JavaScript function -->
    <button type="button" class="post-job" onclick="payWithPaystack()">
      Post a Job – ₦5,000
    </button>

  </div>

  <footer>
    <p>© 2026 NaijaJobConnect | Built by You 💪</p>
  </footer>

  <!-- JavaScript code handling the Paystack popup with your key -->
  <script>
    function payWithPaystack() {
      let handler = PaystackPop.setup({
        key: 'pk_test_cb2c222f698cf1ce0fbb6f0c0b438b44d8b5a924', // Your actual Paystack Public Key
        email: 'customer@email.com', // Change or prompt user for email if needed
        amount: 500000, // Amount in kobo (5,000 NGN)
        currency: 'NGN',
        ref: '' + Math.floor((Math.random() * 1000000000) + 1), // Generates a unique reference
        callback: function(response) {
          alert('Payment complete! Reference: ' + response.reference);
          // Add your post-payment logic here
        },
        onClose: function() {
          alert('Transaction was not completed, window closed.');
        }
      });
      handler.openIframe();
    }
  </script>

</body>
</html>
